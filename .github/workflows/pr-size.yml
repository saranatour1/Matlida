name: PR size

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  size:
    # A human adds the large-pr label to approve an exception.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'large-pr') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/pr-size.sh origin/${{ github.base_ref }}
