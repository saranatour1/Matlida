allowBuilds:
  esbuild: true
  unrs-resolver: false

# One copy of the AI SDK provider spec, so models from @ai-sdk/*, OpenRouter and
# the Convex AI Gateway share the same LanguageModelV4 type.
minimumReleaseAgeExclude:
  - '@ai-sdk/provider-utils@5.0.61'
  - '@ai-sdk/provider@4.0.28'

overrides:
  '@ai-sdk/provider': 4.0.28
  '@ai-sdk/provider-utils': 5.0.61
